
<!DOCTYPE html>
<html>
<head>

    <title>Sleep Quality Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
            font-size: 26px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            background: #e8f4ff;
            color: #243b55;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        .accuracy {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 15px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Sleep Quality Prediction</h1>

        <form action="/predict" method="POST">

            <label>Sleep</label>

            <select name="sleep" required>
                <option value="Poor">Poor</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
            </select>


            <label>Screen Time</label>

            <select name="screen" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>


            <label>Caffeine Consumption</label>

            <select name="caffeine" required>
                <option value="None">None</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>


            <label>Stress Level</label>

            <select name="stress" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>


            <button type="submit">
                Predict Sleep Quality
            </button>

        </form>


        {% if prediction %}

        <div class="result">
            Predicted Sleep Quality: {{ prediction }}
        </div>

        {% endif %}


        <div class="accuracy">
            Model Accuracy: {{ accuracy }}%
        </div>

    </div>

</body>
</html>
